[package]
name = "fc-app"
description = "Interface de Fuck Calorie (Leptos, compilée en WebAssembly)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Sans la fonctionnalité `rng` : l'interface ne crée pas d'identifiants.
fc-core.workspace = true
chrono.workspace = true
serde.workspace = true
uuid.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# Pas de `[lints] workspace = true` : les macros de wasm-bindgen génèrent du code `unsafe`,
# interdit dans le reste du projet.
[lints.clippy]
all = { level = "warn", priority = -1 }
