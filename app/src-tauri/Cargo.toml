[package]
name = "fc-desktop"
description = "Application Fuck Calorie (Tauri 2) : fenêtre, base locale et commandes appelées par l'interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
fc-core = { workspace = true, features = ["rng"] }
fc-food-db = { workspace = true, features = ["http"] }
fc-service.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tauri = { version = "2.12", features = [] }

# Scan de code-barres (§4.2) : mobile uniquement (§4.1).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5"

# Pas de `[lints] workspace = true` : les macros de Tauri génèrent du code `unsafe`.
[lints.clippy]
all = { level = "warn", priority = -1 }
