[package]
name = "fc-core"
description = "Cœur métier de Fuck Calorie : modèles de données et calculs nutritionnels, sans UI ni entrées-sorties."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["rng"]
# Création d'identifiants UUID v7 (`SyncMeta::new`). Inutile à l'interface, qui ne fait
# qu'afficher et transmettre : sans cette fonctionnalité, fc-core n'a besoin d'aucune
# source d'aléa et se compile en WebAssembly sans configuration particulière.
rng = ["uuid/v7"]

[dependencies]
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
