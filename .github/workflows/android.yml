name: APK Android (test)

# Construit un APK de test pour téléphone Android (arm64, Android 7 et plus récent).
#
# - Se lance à chaque envoi sur `main`, ou à la main : onglet Actions → « APK Android (test) »
#   → Run workflow.
# - L'APK est publié dans la pré-version « apk-test » (page Releases du dépôt), qui s'ouvre
#   directement depuis le téléphone, et joint à l'exécution (section Artifacts).
#
# Signature : avec les secrets ANDROID_KEYSTORE (fichier .jks encodé en base64) et
# ANDROID_KEYSTORE_PASSWORD s'ils existent. Sinon, une clé temporaire est créée à chaque
# exécution : l'APK s'installe, mais pour installer le suivant il faut d'abord désinstaller
# le précédent (ce qui efface les données de l'application sur le téléphone).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018
  BUILD_TOOLS: 35.0.0

jobs:
  apk:
    name: APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # `packages` : par défaut l'action installe aussi « tools », un paquet que Google a
      # retiré du dépôt du SDK, et sdkmanager échoue. On n'installe que platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: NDK et outils de build Android
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: cargo-bins/cargo-binstall@main

      - name: Outils (Tauri, Trunk)
        run: cargo binstall --no-confirm tauri-cli@2 trunk

      # Le projet Android (app/src-tauri/gen/android) n'est pas versionné : il est généré ici.
      - name: Projet Android
        working-directory: app
        run: cargo tauri android init --ci

      - name: Compilation
        working-directory: app
        run: cargo tauri android build --apk --target aarch64

      - name: Signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          outputs=app/src-tauri/gen/android/app/build/outputs/apk
          apk=$(find "$outputs" -name '*release*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "APK introuvable. Fichiers produits :"
            find "$outputs" -type f || true
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$keystore"
            pass="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Pas de secret ANDROID_KEYSTORE : APK signé avec une clé temporaire. Pour installer le suivant, désinstalle d'abord celui-ci."
            pass="cle-temporaire"
            keytool -genkeypair -keystore "$keystore" -storepass "$pass" -keypass "$pass" \
              -alias fuckcalorie -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Fuck Calorie"
          fi
          tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist-apk
          "$tools/apksigner" sign --ks "$keystore" --ks-pass "pass:$pass" \
            --out dist-apk/fuck-calorie-test.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify dist-apk/fuck-calorie-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fuck-calorie-apk
          path: dist-apk/fuck-calorie-test.apk
          retention-days: 30

      - name: Pré-version « apk-test »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-test --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-test dist-apk/fuck-calorie-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "APK de test" \
            --notes "Construit automatiquement depuis ${GITHUB_SHA::7}. Version de test, pas une version publiée."
